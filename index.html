<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120e1f"><title>FNF Stage Editor</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/mobile.css"><link rel="stylesheet" href="css/fullscreen.css">
</head><body>
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gt">
<h1 id="gt">LANDSCAPE MODE REQUIRED</h1>
<p>Put your device in landscape mode and enter fullscreen to continue.</p>
<button id="gbtn" class="big">ENTER FULLSCREEN LANDSCAPE</button><p id="gnote" role="status"></p></div>
<div id="app" inert>
<header id="bar" role="toolbar" aria-label="Toolbar">
<button id="tl" title="Toggle objects panel"><i data-i="layers"></i>Objects</button>
<button id="new" title="New stage"><i data-i="filePlus"></i>New Stage</button><button id="open" title="Open .json / .fnfs / images / atlas"><i data-i="folder"></i>Open</button>
<button id="save" class="ok" title="Save project locally (Ctrl+S)"><i data-i="save"></i><span>Saved</span></button><button id="export" class="pri"><i data-i="export"></i>Export</button>
<button id="undo" aria-label="Undo" title="Undo (Ctrl+Z)"><i data-i="undo"></i>Undo</button><button id="redo" aria-label="Redo" title="Redo (Ctrl+Y)"><i data-i="redo"></i>Redo</button>
<button id="play" title="Play preview (Space)"><i data-i="play"></i>Play</button><button id="stop" title="Stop preview" disabled><i data-i="stop"></i>Stop</button>
<button id="fs" title="Fullscreen (F)"><i data-i="full"></i>Fullscreen</button><button id="set" title="Settings"><i data-i="gear"></i>Settings</button>
<button id="tr" title="Toggle inspector panel"><i data-i="sliders"></i>Inspector</button></header>
<main id="main">
<aside id="left" aria-label="Stage objects"><div class="acts"><button id="addp" class="pri"><i data-i="plus"></i>ADD PROP</button><button id="addc" class="pri"><i data-i="plus"></i>ADD CHARACTER</button></div>
<div id="list" role="listbox" aria-label="Objects"></div></aside>
<section class="vp" id="vp"><canvas id="cv" tabindex="0" aria-label="Stage viewport"></canvas></section>
<aside id="right" aria-label="Inspector"><div role="tablist" id="tabs"><button role="tab" data-t="vis" aria-selected="true">Visual</button><button role="tab" data-t="json">JSON</button><button role="tab" data-t="ast">Assets</button></div>
<div class="tp" id="t-vis"><div id="insp"></div></div>
<div class="tp" id="t-json" hidden><textarea id="js" spellcheck="false" aria-label="Stage JSON"></textarea><p id="jerr" role="status"></p>
<div class="acts"><button id="jfmt">Format</button><button id="japp" class="pri">Apply</button><button id="jrst">Reset</button></div></div>
<div class="tp" id="t-ast" hidden><div class="acts"><button id="upl"><i data-i="image"></i>Upload images / atlas</button><button id="addsel" class="pri"><i data-i="plus"></i>Add to stage</button></div><div id="alist"></div></div></aside>
</main>
<footer id="foot"><span id="coord">x 0  y 0</span><span id="zoom">50%</span>
<label>Snap <select id="snap"><option>1</option><option>5</option><option>10</option><option>25</option><option>50</option><option value="c">Custom…</option></select></label>
<label><input type="checkbox" id="grid" checked> Grid</label><label><input type="checkbox" id="anim" checked> Anim</label><button id="fit"><i data-i="fit"></i>Fit</button></footer>
</div>
<dialog id="dlg"><form method="dialog"><h2 id="dt"></h2><div id="db"></div><button>Close</button></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" multiple hidden accept=".json,.fnfs,.zip,.xml,.txt,image/*">
<script type="module" src="js/app.js"></script>
</body></html>
